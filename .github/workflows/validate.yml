name: Validate Application

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax and regression check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            php:8.4-cli \
            sh -c 'find application system tests -type f -name "*.php" ! -path "application/vendor/*" ! -path "application/third_party/PHPExcel_old/*" -print0 | xargs -0 -n1 php -l'

      - name: Run PHP 8.4 regression check
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            php:8.4-cli \
            php tests/database_driver_php84.php

      - name: Run upload security check
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            php:8.4-cli \
            php tests/upload_service.php

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.production.yml config --quiet

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: php

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start development stack
        run: |
          cp .env.example .env
          mkdir -p database
          docker compose up --build -d

      - name: Verify HTTP, CSRF, and upload permissions
        run: scripts/smoke-docker.sh

      - name: Stop development stack
        if: always()
        run: docker compose down -v
