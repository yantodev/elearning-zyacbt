services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      CI_ENV: development
      CSRF_PROTECTION: ${CSRF_PROTECTION:-1}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-zyacbt}
      DB_USERNAME: ${DB_USERNAME:-zyacbt}
      DB_PASSWORD: ${DB_PASSWORD:-zyacbt}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-only-change-me}
      MONITORING_WEBHOOK_URL: ${MONITORING_WEBHOOK_URL:-}
      MONITORING_WEBHOOK_TOKEN: ${MONITORING_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$context = stream_context_create(['http' => ['timeout' => 3]]); $$response = @file_get_contents('http://127.0.0.1/health', false, $$context); exit($$response === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      # Source code dipasang sebagai bind mount agar perubahan langsung aktif
      # tanpa rebuild image. Rebuild hanya diperlukan saat Dockerfile atau
      # dependency Composer berubah.
      - .:/var/www/html
      - app_vendor_v2:/var/www/html/application/vendor
      - app_cache:/var/www/html/application/cache
      - app_logs:/var/www/html/application/logs
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - .git/
            - database/
            - uploads/
            - application/vendor/
            - application/cache/
            - application/logs/
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: application/composer.json
        - action: rebuild
          path: application/composer.lock

  db:
    image: mariadb:10.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zyacbt}
      MYSQL_USER: ${DB_USERNAME:-zyacbt}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zyacbt}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ./database:/var/lib/mysql
      - ./zyacbt-public-2024-05-05-tanpa-database.sql:/docker-entrypoint-initdb.d/01-zyacbt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_vendor_v2:
  app_cache:
  app_logs:
